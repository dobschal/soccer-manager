name: Tests & Deployment

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  version-bump:
    name: "Bump Version"
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Calculate new version
        id: version
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          PREFIX="${YEAR}.${MONTH}."

          # Get the latest tag matching this month's pattern
          LATEST_TAG=$(git tag -l "${PREFIX}*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            # No tags for this month yet, start at 0001
            NEW_VERSION="${PREFIX}0001"
          else
            # Extract the sequence number and increment
            SEQUENCE=$(echo "$LATEST_TAG" | sed "s/${PREFIX}//")
            NEXT_SEQUENCE=$(printf "%04d" $((10#$SEQUENCE + 1)))
            NEW_VERSION="${PREFIX}${NEXT_SEQUENCE}"
          fi

          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update package.json version
        run: |
          npm version ${{ steps.version.outputs.new }} --no-git-tag-version

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new }} [skip ci]"
          git push

  release:
    name: "Create Release"
    runs-on: ubuntu-latest
    needs: [ version-bump ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version-bump.outputs.new_version }}" \
            --title "Release ${{ needs.version-bump.outputs.new_version }}" \
            --generate-notes

  build-desktop-windows:
    name: "Build Windows Desktop App"
    runs-on: windows-latest
    needs: [ lint, test ]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        # Needed by scripts/build-desktop-bundle.mjs (archiver, native-build-utils).
        # --ignore-scripts skips the postinstall (copy-vendor.sh), a bash script
        # that cmd.exe can't run; we replicate it via Git Bash below.
        run: npm ci --ignore-scripts

      - name: Copy client vendor assets
        # postinstall replacement: stages three.js/chart.js into client/vendor
        # so the desktop bundle includes them. Git Bash ships on windows-latest.
        shell: bash
        run: bash scripts/copy-vendor.sh

      - name: Install desktop-app dependencies
        run: npm ci
        working-directory: desktop-app

      - name: Build signed Windows app
        working-directory: desktop-app
        env:
          # electron-builder auto-signs when these are set. Leave the secrets
          # unset to produce an unsigned build (CI stays green either way).
          # CSC_LINK = base64-encoded .pfx, CSC_KEY_PASSWORD = its password.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        # --publish never: electron-builder auto-enables publishing on CI and
        # fails resolving a repo/publish config. We attach artifacts to the
        # release ourselves in the attach-windows-to-release job.
        run: npm run dist:win -- --publish never

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-${{ github.sha }}
          path: |
            dist-desktop/*.exe
          retention-days: 30
          if-no-files-found: error

  attach-windows-to-release:
    name: "Attach Windows App to Release"
    runs-on: ubuntu-latest
    needs: [ version-bump, release, build-desktop-windows ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-desktop-${{ github.sha }}
          path: windows-build

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.version-bump.outputs.new_version }}" \
            windows-build/*.exe \
            --repo "${{ github.repository }}" --clobber

  deploy-prod:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: [ release ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/hetzner.key
          chmod 600 ~/.ssh/hetzner.key
          cat >>~/.ssh/config <<END
          Host hetzner
            HostName $SSH_HOST
            User root
            IdentityFile ~/.ssh/hetzner.key
            StrictHostKeyChecking no
          END
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.HOST }}

      - name: Deploy
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APN_KEY_PATH: ${{ secrets.APN_KEY_PATH }}
          APN_KEY_ID: ${{ secrets.APN_KEY_ID }}
          APN_TEAM_ID: ${{ secrets.APN_TEAM_ID }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          # Write secrets to .env on the server (read by docker compose automatically)
          {
            echo "JWT_SECRET=$JWT_SECRET"
            echo "APN_KEY_PATH=$APN_KEY_PATH"
            echo "APN_KEY_ID=$APN_KEY_ID"
            echo "APN_TEAM_ID=$APN_TEAM_ID"
            echo "FCM_SERVICE_ACCOUNT_PATH=/root/fcm-service-account.json"
            echo "SMTP_HOST=smtp.ionos.de"
            echo "SMTP_PORT=587"
            echo "SMTP_SECURE=false"
            echo "SMTP_USER=info@soccermanager.io"
            echo "SMTP_PASS=$SMTP_PASS"
            echo "EMAIL_FROM=FootballManager.IO <info@soccermanager.io>"
            echo "PUBLIC_URL=https://footballmanager.io"
            echo "DATA_ROOT=/mnt/HC_Volume_105947620/prod"
          } | ssh hetzner "cat > /root/deployments/soccer-manager/.env && chmod 600 /root/deployments/soccer-manager/.env"
          ssh hetzner << EOF
            set -e
            cd /root/deployments/soccer-manager
            git fetch
            git reset --hard origin/main
            # Build new image while old container keeps running
            COMMIT_HASH=$COMMIT_HASH docker compose build soccer-manager --no-cache
            # Start new container - Compose will stop old one and start new one
            # Use --wait to ensure container is healthy before considering deploy complete
            COMMIT_HASH=$COMMIT_HASH docker compose up soccer-manager -d --wait --wait-timeout 60
            docker image prune -f
            docker builder prune -f
          EOF

  deploy-sandbox:
    name: "Deploy to Sandbox"
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/hetzner.key
          chmod 600 ~/.ssh/hetzner.key
          cat >>~/.ssh/config <<END
          Host hetzner
            HostName $SSH_HOST
            User root
            IdentityFile ~/.ssh/hetzner.key
            StrictHostKeyChecking no
          END
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.HOST }}

      - name: Deploy
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_SANDBOX }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          # Sandbox runs without push notifications: APN_* / FCM_* are intentionally empty
          # so the optional volume mounts fall back to /dev/null and the app skips push setup.
          {
            echo "JWT_SECRET=$JWT_SECRET"
            echo "APP_PORT=3014"
            echo "DB_PORT=3307"
            echo "NETWORK_NAME=soccer-manager-sandbox"
            echo "COMPOSE_PROJECT_NAME=soccer-manager-sandbox"
            echo "APN_PRODUCTION=false"
            echo "SMTP_HOST=smtp.ionos.de"
            echo "SMTP_PORT=587"
            echo "SMTP_SECURE=false"
            echo "SMTP_USER=info@soccermanager.io"
            echo "SMTP_PASS=$SMTP_PASS"
            echo "EMAIL_FROM=FootballManager.IO Sandbox <info@soccermanager.io>"
            echo "PUBLIC_URL=https://sandbox.footballmanager.io"
            echo "DATA_ROOT=/mnt/HC_Volume_105947620/sandbox"
          } | ssh hetzner "cat > /root/deployments/soccer-manager-sandbox/.env && chmod 600 /root/deployments/soccer-manager-sandbox/.env"
          ssh hetzner << EOF
            set -e
            cd /root/deployments/soccer-manager-sandbox
            git fetch
            git reset --hard origin/develop
            COMMIT_HASH=$COMMIT_HASH docker compose build soccer-manager --no-cache
            COMMIT_HASH=$COMMIT_HASH docker compose up soccer-manager -d --wait --wait-timeout 60
            docker image prune -f
            docker builder prune -f
          EOF
