<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350">
    <defs>
        <linearGradient id="cardBgSpeech" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#7c3aed"/>
            <stop offset="50%" style="stop-color:#6d28d9"/>
            <stop offset="100%" style="stop-color:#4c1d95"/>
        </linearGradient>
        <linearGradient id="innerBgSpeech" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1a1a2e"/>
            <stop offset="100%" style="stop-color:#16213e"/>
        </linearGradient>
        <filter id="glowSpeech">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Card outer frame -->
    <rect x="0" y="0" width="250" height="350" rx="15" fill="url(#cardBgSpeech)"/>
    <rect x="8" y="8" width="234" height="334" rx="12" fill="url(#innerBgSpeech)"/>

    <!-- Header banner -->
    <rect x="15" y="15" width="220" height="28" rx="5" fill="#7c3aed" opacity="0.9"/>
    <text x="125" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff"
          text-anchor="middle">ACTION CARD
    </text>

    <!-- Card title -->
    <text x="125" y="65" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c4b5fd"
          text-anchor="middle">MOTIVATING SPEECH
    </text>

    <!-- Image area frame -->
    <rect x="20" y="75" width="210" height="140" rx="8" fill="#0f0f1a" stroke="#7c3aed" stroke-width="2"/>

    <!-- Megaphone - cone (wide end on right) -->
    <path d="M155,100 L185,88 L185,198 L155,186 Z" fill="#6d28d9"/>
    <path d="M105,112 L155,100 L155,186 L105,174 Z" fill="#7c3aed"/>

    <!-- Megaphone - mouthpiece (narrow end on left) -->
    <rect x="90" y="118" width="18" height="50" rx="4" fill="#8b5cf6"/>
    <rect x="85" y="124" width="10" height="38" rx="3" fill="#a78bfa"/>

    <!-- Megaphone - handle -->
    <rect x="68" y="136" width="20" height="14" rx="4" fill="#c4b5fd"/>

    <!-- Megaphone - bell opening -->
    <ellipse cx="185" cy="143" rx="6" ry="56" fill="#4c1d95"/>
    <ellipse cx="185" cy="143" rx="4" ry="53" fill="#6d28d9"/>

    <!-- Sound waves -->
    <path d="M195 143 C205 143 205 118 210 118" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" filter="url(#glowSpeech)"/>
    <path d="M195 143 C205 143 205 168 210 168" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" filter="url(#glowSpeech)"/>
    <path d="M200 143 C212 143 212 108 218 108" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" opacity="0.6" filter="url(#glowSpeech)"/>
    <path d="M200 143 C212 143 212 178 218 178" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" opacity="0.6" filter="url(#glowSpeech)"/>

    <!-- Sparkle effects -->
    <path d="M50 100 L55 105 L50 110 L45 105 Z" fill="#c4b5fd"/>
    <path d="M55 170 L58 175 L55 180 L52 175 Z" fill="#c4b5fd"/>
    <path d="M210 95 L213 100 L210 105 L207 100 Z" fill="#c4b5fd"/>

    <!-- +10% indicator -->
    <circle cx="45" cy="190" r="20" fill="#1a1a2e" stroke="#7c3aed" stroke-width="2"/>
    <text x="45" y="186" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c4b5fd"
          text-anchor="middle">+10%
    </text>
    <text x="45" y="198" font-family="Arial, sans-serif" font-size="8" fill="#c4b5fd"
          text-anchor="middle">ALL</text>

    <!-- Description box -->
    <rect x="20" y="225" width="210" height="80" rx="8" fill="#0f0f1a" stroke="#7c3aed" stroke-width="1"/>
    <text x="125" y="248" font-family="Arial, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">Give your entire team a
    </text>
    <text x="125" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c4b5fd"
          text-anchor="middle">+10% LEVEL BOOST
    </text>
    <text x="125" y="290" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a78bfa" text-anchor="middle">for the next game day
    </text>

    <!-- Rarity indicator - 2 stars (uncommon) -->
    <g transform="translate(15, 55) scale(0.8)">
        <polygon points="115,318 119,330 132,330 122,338 126,350 115,342 104,350 108,338 98,330 111,330"
                 fill="#7c3aed"/>
    </g>
    <g transform="translate(35, 55) scale(0.8)">
        <polygon points="115,318 119,330 132,330 122,338 126,350 115,342 104,350 108,338 98,330 111,330"
                 fill="#7c3aed"/>
    </g>
</svg>
