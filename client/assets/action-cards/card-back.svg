<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350">
    <defs>
        <linearGradient id="cardBackBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#c9a84c"/>
            <stop offset="50%" style="stop-color:#f0d060"/>
            <stop offset="100%" style="stop-color:#c9a84c"/>
        </linearGradient>
        <linearGradient id="cardBackInner" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1a1a2e"/>
            <stop offset="100%" style="stop-color:#16213e"/>
        </linearGradient>
        <filter id="glowBack">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Card outer frame -->
    <rect x="0" y="0" width="250" height="350" rx="15" fill="url(#cardBackBg)"/>
    <rect x="8" y="8" width="234" height="334" rx="12" fill="url(#cardBackInner)"/>

    <!-- Decorative diamond pattern -->
    <g opacity="0.08" fill="#c9a84c">
        <rect x="60" y="60" width="30" height="30" rx="2" transform="rotate(45 75 75)"/>
        <rect x="120" y="60" width="30" height="30" rx="2" transform="rotate(45 135 75)"/>
        <rect x="60" y="120" width="30" height="30" rx="2" transform="rotate(45 75 135)"/>
        <rect x="120" y="120" width="30" height="30" rx="2" transform="rotate(45 135 135)"/>
        <rect x="60" y="220" width="30" height="30" rx="2" transform="rotate(45 75 235)"/>
        <rect x="120" y="220" width="30" height="30" rx="2" transform="rotate(45 135 235)"/>
        <rect x="160" y="60" width="30" height="30" rx="2" transform="rotate(45 175 75)"/>
        <rect x="160" y="220" width="30" height="30" rx="2" transform="rotate(45 175 235)"/>
    </g>

    <!-- Question mark -->
    <text x="125" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="120" font-weight="bold" fill="#c9a84c" filter="url(#glowBack)" opacity="0.9">?</text>

    <!-- Decorative border lines -->
    <rect x="20" y="20" width="210" height="310" rx="8" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.2"/>
    <rect x="30" y="30" width="190" height="290" rx="6" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.15"/>
</svg>
