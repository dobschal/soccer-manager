<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350">
    <defs>
        <linearGradient id="cardBg10" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffd700"/>
            <stop offset="50%" style="stop-color:#ffec8b"/>
            <stop offset="100%" style="stop-color:#daa520"/>
        </linearGradient>
        <linearGradient id="innerBg10" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1a1a2e"/>
            <stop offset="100%" style="stop-color:#16213e"/>
        </linearGradient>
        <linearGradient id="goldShine" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" style="stop-color:#b8860b"/>
            <stop offset="50%" style="stop-color:#ffd700"/>
            <stop offset="100%" style="stop-color:#fff8dc"/>
        </linearGradient>
        <filter id="glow10">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="softGlow10">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Card outer frame -->
    <rect x="0" y="0" width="250" height="350" rx="15" fill="url(#cardBg10)"/>
    <rect x="8" y="8" width="234" height="334" rx="12" fill="url(#innerBg10)"/>

    <!-- Header banner -->
    <rect x="15" y="15" width="220" height="28" rx="5" fill="#ffd700" opacity="0.9"/>
    <text x="125" y="34" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a2e"
          text-anchor="middle">ACTION CARD
    </text>

    <!-- Card title -->
    <text x="125" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffd700"
          text-anchor="middle">LEGENDARY MASTERY
    </text>

    <!-- Image area frame -->
    <rect x="20" y="75" width="210" height="140" rx="8" fill="#0f0f1a" stroke="#ffd700" stroke-width="2"/>

    <!-- Background energy circles -->
    <circle cx="125" cy="145" r="55" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.2"/>
    <circle cx="125" cy="145" r="45" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.3"/>
    <circle cx="125" cy="145" r="35" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.4"/>

    <!-- Main star illustration -->
    <polygon points="125,95 136,122 165,122 141,142 151,175 125,157 99,175 109,142 85,122 114,122"
             fill="url(#goldShine)" filter="url(#glow10)"/>

    <!-- Level 10 badge -->
    <circle cx="125" cy="145" r="22" fill="#1a1a2e" stroke="#ffd700" stroke-width="3"/>
    <text x="125" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffd700"
          text-anchor="middle">10
    </text>

    <!-- Arrow up indicator -->
    <g transform="translate(0, 4)">
        <path d="M125 122 L117 130 L121 130 L121 136 L129 136 L129 130 L133 130 Z" fill="#ffd700"
              filter="url(#softGlow10)"/>
    </g>

    <!-- Sparkles and particles -->
    <circle cx="55" cy="95" r="3" fill="#fff" opacity="0.9" filter="url(#softGlow10)"/>
    <circle cx="195" cy="100" r="2.5" fill="#fff" opacity="0.8"/>
    <circle cx="185" cy="185" r="3" fill="#fff" opacity="0.85" filter="url(#softGlow10)"/>
    <circle cx="65" cy="190" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="45" cy="150" r="2" fill="#ffd700" opacity="0.9"/>
    <circle cx="205" cy="140" r="2.5" fill="#ffd700" opacity="0.8"/>
    <circle cx="90" cy="85" r="1.5" fill="#fff"/>
    <circle cx="160" cy="200" r="1.5" fill="#fff"/>

    <!-- Diamond sparkles -->
    <path d="M50 120 L55 125 L50 130 L45 125 Z" fill="#fff" opacity="0.8"/>
    <path d="M200 160 L204 165 L200 170 L196 165 Z" fill="#fff" opacity="0.7"/>
    <path d="M70 175 L73 178 L70 181 L67 178 Z" fill="#ffd700"/>
    <path d="M180 110 L183 113 L180 116 L177 113 Z" fill="#ffd700"/>

    <!-- Small floating stars -->
    <polygon points="40,105 42,110 47,110 43,113 45,118 40,115 35,118 37,113 33,110 38,110" fill="#ffd700" opacity="0.6"/>
    <polygon points="210,175 212,180 217,180 213,183 215,188 210,185 205,188 207,183 203,180 208,180" fill="#ffd700" opacity="0.5"/>

    <!-- Description box -->
    <rect x="20" y="225" width="210" height="80" rx="8" fill="#0f0f1a" stroke="#ffd700" stroke-width="1"/>
    <text x="125" y="248" font-family="Arial, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">Give a
        player a
    </text>
    <text x="125" y="272" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffd700"
          text-anchor="middle">LEVEL UP
    </text>
    <text x="125" y="290" font-family="Arial, sans-serif" font-size="10" fill="#c0c0c0" text-anchor="middle">
        Up to level 10
    </text>

    <!-- Rarity indicator - 3 legendary stars -->
    <g transform="translate(0,-10)">
        <polygon points="125,318 130,330 143,330 133,338 137,350 125,342 113,350 117,338 107,330 120,330" fill="#ffd700"
                 filter="url(#softGlow10)"/>
        <polygon points="90,322 94,332 105,332 96,339 100,348 90,342 80,348 84,339 75,332 86,332" fill="#ffd700"
                 opacity="0.8"/>
        <polygon points="160,322 164,332 175,332 166,339 170,348 160,342 150,348 154,339 145,332 156,332" fill="#ffd700"
                 opacity="0.8"/>
    </g>
</svg>
