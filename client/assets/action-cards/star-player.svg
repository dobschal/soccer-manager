<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350">
    <defs>
        <linearGradient id="cardBgStar" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#b8860b"/>
            <stop offset="50%" style="stop-color:#daa520"/>
            <stop offset="100%" style="stop-color:#8b6914"/>
        </linearGradient>
        <linearGradient id="innerBgStar" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1a1a2e"/>
            <stop offset="100%" style="stop-color:#16213e"/>
        </linearGradient>
        <filter id="glowStar">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffd700"/>
            <stop offset="50%" style="stop-color:#ffec8b"/>
            <stop offset="100%" style="stop-color:#daa520"/>
        </linearGradient>
    </defs>

    <!-- Card outer frame -->
    <rect x="0" y="0" width="250" height="350" rx="15" fill="url(#cardBgStar)"/>
    <rect x="8" y="8" width="234" height="334" rx="12" fill="url(#innerBgStar)"/>

    <!-- Header banner -->
    <rect x="15" y="15" width="220" height="28" rx="5" fill="#daa520" opacity="0.9"/>
    <text x="125" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a2e"
          text-anchor="middle">ACTION CARD
    </text>

    <!-- Card title -->
    <text x="125" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffd700"
          text-anchor="middle">STAR PLAYER
    </text>

    <!-- Image area frame -->
    <rect x="20" y="75" width="210" height="140" rx="8" fill="#0f0f1a" stroke="#daa520" stroke-width="2"/>

    <!-- Large central star -->
    <polygon points="125,90 135,120 168,120 141,138 151,168 125,150 99,168 109,138 82,120 115,120"
             fill="url(#starGrad)" filter="url(#glowStar)"/>

    <!-- Small decorative stars -->
    <polygon points="60,95 64,105 75,105 66,111 70,121 60,115 50,121 54,111 45,105 56,105"
             fill="#ffd700" opacity="0.6"/>
    <polygon points="190,95 194,105 205,105 196,111 200,121 190,115 180,121 184,111 175,105 186,105"
             fill="#ffd700" opacity="0.6"/>
    <polygon points="70,160 73,168 81,168 75,173 77,181 70,176 63,181 65,173 59,168 67,168"
             fill="#ffd700" opacity="0.5"/>
    <polygon points="180,160 183,168 191,168 185,173 187,181 180,176 173,181 175,173 169,168 177,168"
             fill="#ffd700" opacity="0.5"/>

    <!-- Sparkle effects -->
    <path d="M100 100 L103 105 L100 110 L97 105 Z" fill="#fff"/>
    <path d="M150 100 L153 105 L150 110 L147 105 Z" fill="#fff"/>
    <path d="M125 170 L128 175 L125 180 L122 175 Z" fill="#fff"/>

    <!-- +10% indicator -->
    <circle cx="45" cy="190" r="20" fill="#1a1a2e" stroke="#daa520" stroke-width="2"/>
    <text x="45" y="186" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffd700"
          text-anchor="middle">+10%
    </text>
    <text x="45" y="198" font-family="Arial, sans-serif" font-size="7" fill="#ffd700"
          text-anchor="middle">LEVEL</text>

    <!-- Description box -->
    <rect x="20" y="225" width="210" height="80" rx="8" fill="#0f0f1a" stroke="#daa520" stroke-width="1"/>
    <text x="125" y="248" font-family="Arial, sans-serif" font-size="12" fill="#e0e0e0" text-anchor="middle">Promote a player to
    </text>
    <text x="125" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffd700"
          text-anchor="middle">STAR PLAYER STATUS
    </text>
    <text x="125" y="288" font-family="Arial, sans-serif" font-size="10" fill="#c0c0c0" text-anchor="middle">Permanent +10% level
        bonus
    </text>

    <!-- Rarity indicator - 3 stars (rare) -->
    <g transform="translate(5, 55) scale(0.8)">
        <polygon points="115,318 119,330 132,330 122,338 126,350 115,342 104,350 108,338 98,330 111,330"
                 fill="#daa520"/>
    </g>
    <g transform="translate(25, 55) scale(0.8)">
        <polygon points="115,318 119,330 132,330 122,338 126,350 115,342 104,350 108,338 98,330 111,330"
                 fill="#daa520"/>
    </g>
    <g transform="translate(45, 55) scale(0.8)">
        <polygon points="115,318 119,330 132,330 122,338 126,350 115,342 104,350 108,338 98,330 111,330"
                 fill="#daa520"/>
    </g>
</svg>
