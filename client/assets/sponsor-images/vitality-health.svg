<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="vitalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#be185d"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="200" height="100" fill="url(#vitalGrad)"/>
  <!-- Heart with pulse -->
  <path d="M50 35 Q40 25 30 35 Q20 50 50 70 Q80 50 70 35 Q60 25 50 35" fill="#fff"/>
  <!-- Pulse line through heart -->
  <path d="M25 50 L40 50 L45 40 L50 60 L55 45 L60 50 L75 50" fill="none" stroke="#ec4899" stroke-width="2"/>
  <text x="90" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">VITALITY</text>
  <text x="90" y="60" font-family="Arial, sans-serif" font-size="9" fill="#fbcfe8">HEALTH</text>
</svg>
