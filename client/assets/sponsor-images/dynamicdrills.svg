<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="drillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ca8a04"/>
      <stop offset="100%" style="stop-color:#eab308"/>
    </linearGradient>
  </defs>
  <rect width="200" height="100" fill="url(#drillGrad)"/>
  <!-- Drill -->
  <rect x="25" y="40" width="35" height="20" rx="3" fill="#fff"/>
  <polygon points="60,45 80,48 80,52 60,55" fill="#fef3c7"/>
  <polygon points="80,48 90,50 80,52" fill="#d4d4d8"/>
  <!-- Handle -->
  <rect x="30" y="60" width="10" height="15" rx="2" fill="#fef3c7"/>
  <!-- Trigger -->
  <rect x="42" y="55" width="8" height="8" rx="1" fill="#d4d4d8"/>
  <!-- Motion lines -->
  <path d="M85 45 L95 42" stroke="#fff" stroke-width="2"/>
  <path d="M88 50 L98 50" stroke="#fff" stroke-width="2"/>
  <path d="M85 55 L95 58" stroke="#fff" stroke-width="2"/>
  <text x="105" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">DynamicDrills</text>
</svg>
