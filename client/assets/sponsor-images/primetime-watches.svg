  <text x="85" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">PRIMETIME</text>
  <text x="85" y="58" font-family="Arial, sans-serif" font-size="8" fill="#fef3c7">WATCHES</text>
