      <stop offset="0%" style="stop-color:#7c2d12"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="200" height="100" fill="url(#globoGrad)"/>
  <!-- TV/Monitor with globe -->
  <rect x="25" y="30" width="50" height="35" rx="3" fill="#fff"/>
  <rect x="30" y="35" width="40" height="25" fill="#1e293b"/>
  <!-- Globe inside screen -->
