  <path d="M40 47 L60 47" stroke="#ea580c" stroke-width="1"/>
  <rect x="45" y="65" width="10" height="5" fill="#fff"/>
  <rect x="40" y="70" width="20" height="3" fill="#fff"/>
  <text x="85" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">GLOBOVISION</text>
  <text x="85" y="58" font-family="Arial, sans-serif" font-size="8" fill="#fed7aa">MEDIA</text>
</svg>
