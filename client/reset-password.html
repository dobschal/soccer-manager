<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset your password – FootballManager.IO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            color: #222;
        }

        .container {
            max-width: 520px;
            margin: 40px auto;
            padding: 32px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .logo {
            margin-bottom: 16px;
        }

        h1 {
            font-size: 22px;
            color: #111;
            margin: 0 0 16px 0;
        }

        .intro {
            margin: 0 0 16px 0;
            color: #444;
            font-size: 14px;
        }

        .status {
            margin: 16px 0;
            font-size: 16px;
            line-height: 1.5;
            min-height: 24px;
        }

        .status.success {
            color: #156c2c;
        }

        .status.error {
            color: #8a1f1f;
        }

        form {
            text-align: left;
            margin-top: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #444;
            margin-bottom: 4px;
        }

        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #17a2b8;
        }

        .btn {
            display: inline-block;
            background-color: #17a2b8;
            color: #ffffff;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer-links {
            margin-top: 32px;
            font-size: 12px;
            color: #666;
        }

        .footer-links a {
            color: #666;
            text-decoration: underline;
            margin: 0 8px;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #ddd;
            border-top-color: #17a2b8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <img src="assets/logo.svg" alt="FootballManager.IO" height="48">
        <div style="font-weight:bold;font-size:18px;margin-top:8px;">FootballManager.IO</div>
    </div>
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>

    <form id="reset-form">
        <label for="new-password" id="label-new-password"></label>
        <input id="new-password" type="password" minlength="8" required autocomplete="new-password">
        <label for="repeat-password" id="label-repeat-password"></label>
        <input id="repeat-password" type="password" minlength="8" required autocomplete="new-password">
        <div id="status" class="status"></div>
        <button class="btn" id="submit-btn" type="submit"></button>
    </form>

    <a id="cta" class="btn hidden" href="./#login?type=login"></a>

    <div class="footer-links">
        <a id="link-privacy" href="imprint.html"></a>
        <a id="link-support" href="support.html"></a>
        <a id="link-app" href="./"></a>
    </div>
</div>

<script>
    (function () {
        const params = new URLSearchParams(window.location.search)
        const token = params.get('token') || ''
        const lang = (params.get('lang') || navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en'

        const tr = {
            en: {
                title: 'Reset your password',
                intro: 'Choose a new password for your FootballManager.IO account.',
                newPassword: 'New password',
                repeatPassword: 'Repeat new password',
                submit: 'Set new password',
                submitting: 'Saving…',
                success: 'Password updated',
                successBody: 'Your password has been updated. You can now log in with your new password.',
                error: 'Could not reset password',
                errorBody: 'This reset link is invalid or has expired. Please request a new one.',
                network: 'Network error. Please try again later.',
                missing: 'Missing token in the link. Please use the link from the email.',
                tooShort: 'Password must be at least 8 characters long.',
                mismatch: 'The two passwords do not match.',
                openApp: 'Back to login',
                privacy: 'Privacy',
                support: 'Support'
            },
            de: {
                title: 'Passwort zurücksetzen',
                intro: 'Wähle ein neues Passwort für deinen FootballManager.IO-Account.',
                newPassword: 'Neues Passwort',
                repeatPassword: 'Neues Passwort wiederholen',
                submit: 'Neues Passwort speichern',
                submitting: 'Speichere…',
                success: 'Passwort aktualisiert',
                successBody: 'Dein Passwort wurde geändert. Du kannst dich jetzt mit dem neuen Passwort anmelden.',
                error: 'Passwort konnte nicht zurückgesetzt werden',
                errorBody: 'Dieser Link ist ungültig oder abgelaufen. Bitte fordere einen neuen an.',
                network: 'Netzwerkfehler. Bitte versuche es später erneut.',
                missing: 'Im Link fehlt der Token. Bitte verwende den Link aus der E-Mail.',
                tooShort: 'Das Passwort muss mindestens 8 Zeichen lang sein.',
                mismatch: 'Die beiden Passwörter stimmen nicht überein.',
                openApp: 'Zur Anmeldung',
                privacy: 'Datenschutz',
                support: 'Support'
            }
        }[lang]

        const titleEl = document.getElementById('title')
        const introEl = document.getElementById('intro')
        const statusEl = document.getElementById('status')
        const ctaEl = document.getElementById('cta')
        const formEl = document.getElementById('reset-form')
        const submitBtn = document.getElementById('submit-btn')
        const newPasswordInput = document.getElementById('new-password')
        const repeatPasswordInput = document.getElementById('repeat-password')

        titleEl.textContent = tr.title
        introEl.textContent = tr.intro
        document.getElementById('label-new-password').textContent = tr.newPassword
        document.getElementById('label-repeat-password').textContent = tr.repeatPassword
        submitBtn.textContent = tr.submit
        ctaEl.textContent = tr.openApp
        document.getElementById('link-privacy').textContent = tr.privacy
        document.getElementById('link-support').textContent = tr.support
        document.getElementById('link-app').textContent = tr.openApp

        const showError = (msg) => {
            statusEl.className = 'status error'
            statusEl.textContent = msg
        }
        const clearStatus = () => {
            statusEl.className = 'status'
            statusEl.textContent = ''
        }
        const showSuccess = () => {
            titleEl.textContent = tr.success
            introEl.textContent = tr.successBody
            statusEl.className = 'status success'
            statusEl.textContent = ''
            formEl.classList.add('hidden')
            ctaEl.classList.remove('hidden')
            // Auto-redirect to login after a short delay
            setTimeout(() => { window.location.href = './#login?type=login' }, 2500)
        }

        if (!token) {
            showError(tr.missing)
            submitBtn.disabled = true
            return
        }

        formEl.addEventListener('submit', async (event) => {
            event.preventDefault()
            clearStatus()
            const newPassword = newPasswordInput.value
            const repeatPassword = repeatPasswordInput.value
            if (newPassword.length < 8) {
                showError(tr.tooShort)
                return
            }
            if (newPassword !== repeatPassword) {
                showError(tr.mismatch)
                return
            }
            submitBtn.disabled = true
            submitBtn.textContent = tr.submitting
            try {
                const res = await fetch('/api/resetPassword', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept-Language': lang },
                    body: JSON.stringify({ params: [token, newPassword] })
                })
                const data = await res.json()
                if (!res.ok) {
                    showError((data && data.message) || tr.errorBody)
                    submitBtn.disabled = false
                    submitBtn.textContent = tr.submit
                    return
                }
                showSuccess()
            } catch (e) {
                showError(tr.network)
                submitBtn.disabled = false
                submitBtn.textContent = tr.submit
            }
        })
    })()
</script>

</body>
</html>
