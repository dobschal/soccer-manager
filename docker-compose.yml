services:
  database:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=soccer
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - '127.0.0.1:3306:3306'
    command: [ "mysqld", "--default-authentication-plugin=mysql_native_password" ]
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 10s
      retries: 10
    networks:
      - soccer-manager

  soccer-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
    restart: always
    ports:
      - "3013:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - soccer-manager

networks:
  soccer-manager:
    external: true
