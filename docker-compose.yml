services:
  database:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=soccer
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - '127.0.0.1:${DB_PORT:-3306}:3306'
    command: [ "mysqld", "--default-authentication-plugin=mysql_native_password" ]
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 10s
      retries: 10
    networks:
      - soccer-manager

  soccer-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
    restart: always
    ports:
      - "${APP_PORT:-3013}:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - APN_KEY_PATH=${APN_KEY_PATH}
      - APN_KEY_ID=${APN_KEY_ID}
      - APN_TEAM_ID=${APN_TEAM_ID}
      - APN_PRODUCTION=${APN_PRODUCTION:-true}
      - FCM_SERVICE_ACCOUNT_PATH=${FCM_SERVICE_ACCOUNT_PATH}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - PUBLIC_URL=${PUBLIC_URL}
    volumes:
      - ${APN_KEY_PATH:-/dev/null}:${APN_KEY_PATH:-/dev/null}:ro
      - ${FCM_SERVICE_ACCOUNT_PATH:-/dev/null}:${FCM_SERVICE_ACCOUNT_PATH:-/dev/null}:ro
      - forum-uploads:/usr/src/app/uploads/forum
      - avatar-uploads:/usr/src/app/uploads/avatars
    depends_on:
      database:
        condition: service_healthy
    networks:
      - soccer-manager

volumes:
  forum-uploads:
  avatar-uploads:

networks:
  soccer-manager:
    external: true
    name: ${NETWORK_NAME:-soccer-manager}
