services:
  database:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=soccer
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - '127.0.0.1:3306:3306'
    command: [ "mysqld", "--default-authentication-plugin=mysql_native_password" ]
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 10s
      retries: 10
    networks:
      - soccer-manager

  soccer-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
    restart: always
    ports:
      - "3013:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - APN_KEY_PATH=${APN_KEY_PATH}
      - APN_KEY_ID=${APN_KEY_ID}
      - APN_TEAM_ID=${APN_TEAM_ID}
      - APN_PRODUCTION=true
      - FCM_SERVICE_ACCOUNT_PATH=${FCM_SERVICE_ACCOUNT_PATH}
    volumes:
      - ${APN_KEY_PATH:-/dev/null}:${APN_KEY_PATH:-/dev/null}:ro
      - ${FCM_SERVICE_ACCOUNT_PATH:-/dev/null}:${FCM_SERVICE_ACCOUNT_PATH:-/dev/null}:ro
      - forum-uploads:/usr/src/app/uploads/forum
    depends_on:
      database:
        condition: service_healthy
    networks:
      - soccer-manager

volumes:
  forum-uploads:

networks:
  soccer-manager:
    external: true
