services:
  database:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=soccer
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - '127.0.0.1:${DB_PORT:-3306}:3306'
    command: [ "mysqld", "--default-authentication-plugin=mysql_native_password" ]
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 10s
      retries: 10
    volumes:
      - ${DATA_ROOT:-./data}/mysql:/var/lib/mysql
    networks:
      - soccer-manager

  soccer-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
    restart: always
    ports:
      - "${APP_PORT:-3013}:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - APN_KEY_PATH=${APN_KEY_PATH}
      - APN_KEY_ID=${APN_KEY_ID}
      - APN_TEAM_ID=${APN_TEAM_ID}
      - APN_PRODUCTION=${APN_PRODUCTION:-true}
      - FCM_SERVICE_ACCOUNT_PATH=${FCM_SERVICE_ACCOUNT_PATH}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - PUBLIC_URL=${PUBLIC_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
    volumes:
      - ${APN_KEY_PATH:-/dev/null}:${APN_KEY_PATH:-/dev/null}:ro
      - ${FCM_SERVICE_ACCOUNT_PATH:-/dev/null}:${FCM_SERVICE_ACCOUNT_PATH:-/dev/null}:ro
      - ${DATA_ROOT:-./data}/uploads/forum:/usr/src/app/uploads/forum
      - ${DATA_ROOT:-./data}/uploads/avatars:/usr/src/app/uploads/avatars
      - ${DATA_ROOT:-./data}/uploads/friend-posts:/usr/src/app/uploads/friend-posts
      - ${DATA_ROOT:-./data}/uploads/wiki:/usr/src/app/uploads/wiki
      - ${DATA_ROOT:-./data}/uploads/chat:/usr/src/app/uploads/chat
      - ${DATA_ROOT:-./data}/uploads/notification:/usr/src/app/uploads/notification
    depends_on:
      database:
        condition: service_healthy
    networks:
      - soccer-manager

networks:
  soccer-manager:
    external: true
    name: ${NETWORK_NAME:-soccer-manager}
